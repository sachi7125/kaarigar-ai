name: kaarigar
description: KaarigarAI — voice-first, offline-first artisan business manager.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0          # capture the craft
  record: ^5.1.0           # voice notes
  sqflite: ^2.3.0          # local store + drafts
  path_provider: ^2.1.0
  http: ^1.2.0             # talks to FastAPI
  flutter_tts: ^4.0.0      # spoken read-back / nudges (or platform TTS)
  connectivity_plus: ^6.0.0 # online/offline state for the sync queue
  image: ^4.2.0            # downscale before queueing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
