<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a2b"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e63"/>
    </marker>
  </defs>

  <rect width="1480" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="44" y="52" font-size="27" font-weight="bold" fill="#1a1a1a">KaarigarAI — System Architecture</text>
  <text x="44" y="76" font-size="14" fill="#6b6b6b">Six layers · one system of record · no paid service · SIH26090</text>
  <rect x="44" y="90" width="200" height="3" fill="#8a5a2b"/>

  <!-- ZONE BACKGROUNDS -->
  <rect x="44" y="130" width="330" height="700" rx="8" fill="#f8f5f0" stroke="#e2dbd0"/>
  <rect x="410" y="130" width="640" height="700" rx="8" fill="#f6f7f8" stroke="#dfe3e6"/>
  <rect x="1086" y="130" width="350" height="700" rx="8" fill="#f8f5f0" stroke="#e2dbd0"/>

  <text x="64" y="158" font-size="12" font-weight="bold" fill="#8a5a2b" letter-spacing="1">1 · ON THE DEVICE — FLUTTER</text>
  <text x="430" y="158" font-size="12" font-weight="bold" fill="#1f4e63" letter-spacing="1">3–5 · BACKEND — STATELESS</text>
  <text x="1106" y="158" font-size="12" font-weight="bold" fill="#8a5a2b" letter-spacing="1">6 · DELIVERY SURFACES</text>

  <!-- DEVICE BOXES -->
  <g font-size="14" fill="#1a1a1a">
    <rect x="64" y="176" width="290" height="46" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="80" y="205">Voice-first first run · language tiles</text>

    <rect x="64" y="232" width="290" height="46" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="80" y="261">Camera capture</text>

    <rect x="64" y="288" width="290" height="46" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="80" y="317">Voice note · maker story</text>

    <rect x="64" y="344" width="290" height="46" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="80" y="373">Offer inbox · accept by voice</text>

    <rect x="64" y="400" width="290" height="46" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="80" y="429">Dashboard · quality meter</text>
  </g>

  <rect x="64" y="470" width="290" height="86" rx="5" fill="#fdf6e9" stroke="#e0c893"/>
  <text x="80" y="496" font-size="14" font-weight="bold" fill="#6b4a10">2 · Local store + outbound queue</text>
  <text x="80" y="518" font-size="12.5" fill="#4a4a4a">SQLite · client-generated ids · drafts</text>
  <text x="80" y="537" font-size="12.5" fill="#4a4a4a">image downscale · oldest-first sync</text>

  <rect x="64" y="574" width="290" height="66" rx="5" fill="#fff" stroke="#d8cfc2"/>
  <text x="80" y="598" font-size="13" font-weight="bold" fill="#23532b">Works with no network</text>
  <text x="80" y="618" font-size="12" fill="#4a4a4a">capture · record · queue · past listings</text>

  <rect x="64" y="656" width="290" height="66" rx="5" fill="#fff" stroke="#d8cfc2"/>
  <text x="80" y="680" font-size="13" font-weight="bold" fill="#7a2b22">Needs network</text>
  <text x="80" y="700" font-size="12" fill="#4a4a4a">translate · describe · price · publish</text>

  <rect x="64" y="738" width="290" height="74" rx="5" fill="#fff" stroke="#d8cfc2"/>
  <text x="80" y="762" font-size="13" font-weight="bold" fill="#1a1a1a">Offline speech fallback</text>
  <text x="80" y="781" font-size="12" fill="#4a4a4a">quantized tiny whisper.cpp, ~70 MB,</text>
  <text x="80" y="798" font-size="12" fill="#4a4a4a">fetched on first sync — not bundled</text>

  <!-- BACKEND -->
  <rect x="430" y="176" width="600" height="60" rx="5" fill="#fff" stroke="#c9d4da"/>
  <text x="448" y="202" font-size="15" font-weight="bold" fill="#1f4e63">4 · FastAPI — stateless</text>
  <text x="448" y="224" font-size="12.5" fill="#4a4a4a">pricing rules · offer + stock validation · public storefront and listing rendering</text>

  <rect x="430" y="256" width="285" height="62" rx="5" fill="#fff" stroke="#c9d4da"/>
  <text x="448" y="280" font-size="14" font-weight="bold" fill="#1a1a1a">Job queue</text>
  <text x="448" y="301" font-size="12" fill="#4a4a4a">AI calls never block a request</text>

  <rect x="745" y="256" width="285" height="62" rx="5" fill="#eaf1f5" stroke="#9fc0d0"/>
  <text x="763" y="280" font-size="14" font-weight="bold" fill="#1f4e63">3 · PostgreSQL</text>
  <text x="763" y="301" font-size="12" fill="#4a4a4a">single system of record</text>

  <!-- pipelines -->
  <text x="430" y="352" font-size="12" font-weight="bold" fill="#1f4e63" letter-spacing="1">5 · AI PIPELINE WORKERS</text>
  <g>
    <rect x="430" y="364" width="192" height="120" rx="5" fill="#fff" stroke="#c9d4da"/>
    <text x="446" y="388" font-size="14" font-weight="bold">Image</text>
    <text x="446" y="410" font-size="12" fill="#4a4a4a">rembg U2-Net</text>
    <text x="446" y="429" font-size="12" fill="#4a4a4a">OpenCV correction</text>
    <text x="446" y="448" font-size="12" fill="#4a4a4a">saliency crop</text>
    <text x="446" y="469" font-size="12" fill="#4a4a4a">texture close-up</text>

    <rect x="634" y="364" width="192" height="120" rx="5" fill="#fff" stroke="#c9d4da"/>
    <text x="650" y="388" font-size="14" font-weight="bold">Voice → listing</text>
    <text x="650" y="410" font-size="12" fill="#4a4a4a">whisper.cpp</text>
    <text x="650" y="429" font-size="12" fill="#4a4a4a">IndicTrans2 (200M)</text>
    <text x="650" y="448" font-size="12" fill="#4a4a4a">Gemini description</text>
    <text x="650" y="469" font-size="12" fill="#4a4a4a">glossary · PI strip · TTS</text>

    <rect x="838" y="364" width="192" height="120" rx="5" fill="#fff" stroke="#c9d4da"/>
    <text x="854" y="388" font-size="14" font-weight="bold">Pricing</text>
    <text x="854" y="410" font-size="12" fill="#4a4a4a">image+text → attributes</text>
    <text x="854" y="429" font-size="12" fill="#4a4a4a">XGBoost band</text>
    <text x="854" y="448" font-size="12" fill="#4a4a4a">SHAP explanation</text>
    <text x="854" y="469" font-size="12" fill="#4a4a4a">material-rate floor</text>
  </g>

  <rect x="430" y="506" width="600" height="52" rx="5" fill="#fff" stroke="#c9d4da"/>
  <text x="448" y="529" font-size="14" font-weight="bold">Object storage</text>
  <text x="448" y="548" font-size="12" fill="#4a4a4a">product photos served publicly from storage, never from the app host</text>

  <rect x="430" y="578" width="600" height="52" rx="5" fill="#fdf6e9" stroke="#e0c893"/>
  <text x="448" y="601" font-size="14" font-weight="bold" fill="#6b4a10">Firebase Cloud Messaging — delivery only</text>
  <text x="448" y="620" font-size="12" fill="#4a4a4a">push notifications. Deliberately not a datastore, so there is no two-way sync to fail</text>

  <rect x="430" y="656" width="600" height="76" rx="5" fill="#fff" stroke="#c9d4da"/>
  <text x="448" y="680" font-size="13" font-weight="bold" fill="#1f4e63">Reference data — assembled before the build</text>
  <text x="448" y="701" font-size="12" fill="#4a4a4a">price points sampled from public listings (observed/synthesised flagged) · material-rate table</text>
  <text x="448" y="720" font-size="12" fill="#4a4a4a">craft glossary · marketplace category maps</text>

  <rect x="430" y="752" width="600" height="60" rx="5" fill="#f4f1ec" stroke="#c9d4da"/>
  <text x="448" y="775" font-size="13" font-weight="bold">Scaling path</text>
  <text x="448" y="796" font-size="12" fill="#4a4a4a">stateless API + queued jobs + storage → scale by adding workers, not redesigning</text>

  <!-- DELIVERY -->
  <g font-size="14">
    <rect x="1106" y="176" width="310" height="72" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="1122" y="199" font-weight="bold">Artisan storefront</text>
    <text x="1122" y="218" font-size="12" fill="#4a4a4a">maker story + every listing · one URL</text>
    <text x="1122" y="236" font-size="12" fill="#4a4a4a">buyers follow for new work</text>

    <rect x="1106" y="260" width="310" height="72" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="1122" y="283" font-weight="bold">Permanent listing page</text>
    <text x="1122" y="302" font-size="12" fill="#4a4a4a">photos · bilingual description · price</text>
    <text x="1122" y="320" font-size="12" fill="#4a4a4a">maker story audio · report an issue</text>

    <rect x="1106" y="344" width="310" height="72" rx="5" fill="#fdf6e9" stroke="#e0c893"/>
    <text x="1122" y="367" font-weight="bold" fill="#6b4a10">Structured offer</text>
    <text x="1122" y="386" font-size="12" fill="#4a4a4a">price · quantity · date</text>
    <text x="1122" y="404" font-size="12" fill="#4a4a4a">unique or batch · below-asking auto-declined</text>

    <rect x="1106" y="430" width="310" height="72" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="1122" y="453" font-weight="bold">Marketplace export bundle</text>
    <text x="1122" y="472" font-size="12" fill="#4a4a4a">GeM · ONDC · Amazon Karigar · ODOP</text>
    <text x="1122" y="490" font-size="12" fill="#4a4a4a">works with zero buyers of our own</text>

    <rect x="1106" y="514" width="310" height="52" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="1122" y="537" font-weight="bold">Share card</text>
    <text x="1122" y="556" font-size="12" fill="#4a4a4a">one listing image, forwarded on WhatsApp</text>

    <rect x="1106" y="578" width="310" height="72" rx="5" fill="#fff" stroke="#d8cfc2"/>
    <text x="1122" y="601" font-weight="bold">Stall QR poster</text>
    <text x="1122" y="620" font-size="12" fill="#4a4a4a">printed for the fair · opens her storefront,</text>
    <text x="1122" y="638" font-size="12" fill="#4a4a4a">on a permanent URL, months later</text>
  </g>

  <rect x="1106" y="672" width="310" height="88" rx="5" fill="#f4f1ec" stroke="#d8cfc2"/>
  <text x="1122" y="696" font-size="13" font-weight="bold">Out of scope, stated</text>
  <text x="1122" y="717" font-size="12" fill="#4a4a4a">payment · shipping · dispute resolution.</text>
  <text x="1122" y="735" font-size="12" fill="#4a4a4a">An accepted offer records intent and</text>
  <text x="1122" y="753" font-size="12" fill="#4a4a4a">exchanges contact details, nothing more.</text>

  <!-- FLOW A — artisan path, routed in the gutters, right angles only -->
  <g fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#ar)">
    <path d="M358 513 H386 V194 H426"/>
    <path d="M660 240 V252"/>
    <path d="M660 322 V360"/>
    <path d="M832 360 V340 H886 V322"/>
    <path d="M887 254 V240"/>
    <path d="M1034 194 H1100"/>
  </g>

  <!-- FLOW B — buyer path -->
  <g fill="none" stroke="#1f4e63" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ar2)">
    <path d="M1102 357 H1068 V222 H1036"/>
    <path d="M426 604 H398 V367 H360"/>
  </g>
  <text x="452" y="647" font-size="11.5" font-weight="bold" fill="#1f4e63">buyer offer → validated → stored → pushed to her phone</text>

  <!-- legend -->
  <rect x="44" y="848" width="1392" height="1" fill="#e2dbd0"/>
  <line x1="60" y1="874" x2="110" y2="874" stroke="#8a5a2b" stroke-width="2.2"/>
  <text x="120" y="878" font-size="12" fill="#4a4a4a">Artisan path — photo and voice note to a published listing</text>
  <line x1="560" y1="874" x2="610" y2="874" stroke="#1f4e63" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="620" y="878" font-size="12" fill="#4a4a4a">Buyer path — offer to acceptance, spoken aloud to the artisan</text>
  <text x="1120" y="878" font-size="12" fill="#8a8a8a">Every component free or open-source</text>
</svg>
